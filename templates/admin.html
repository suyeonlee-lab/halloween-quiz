<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 퀴즈 응답 통계</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #120826;
            color: #fff;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff9e22;
            font-size: 24px;
        }
        .download-btn {
            background: linear-gradient(135deg, #00c853, #009624);
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.3);
        }
        h2 {
            font-size: 18px;
            margin: 30px 0 15px 0;
            color: #ffb74d;
        }

        .filter-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid #ff9e22;
            background: rgba(255, 158, 34, 0.1);
            color: #ff9e22;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #ff9e22;
            color: #120826;
        }

        .stats-summary {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 158, 34, 0.3);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            text-align: center;
        }
        .card .title {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            color: #ff9e22;
        }

        .q-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .q-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff9e22;
            margin-bottom: 15px;
        }
        .bar-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .bar-label {
            width: 50px;
            color: #ddd;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 10px;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9e22, #ff5200);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .bar-value {
            width: 80px;
            text-align: right;
            color: #ffb74d;
            font-weight: bold;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }
        th {
            background: rgba(255, 158, 34, 0.2);
            color: #ffb74d;
            font-weight: bold;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            background: #ff9e22;
            color: #120826;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header-area">
    <h1>🎃 할로윈 퀴즈 응답 통계</h1>
    <a href="/download/csv" class="download-btn">📥 엑셀(CSV) 백업 다운로드</a>
</div>

<!-- 거점 필터 버튼 영역 -->
<div class="filter-container">
    <button class="filter-btn active" onclick="filterLocation('ALL')">전체 거점 보기</button>
    <button class="filter-btn" onclick="filterLocation('판교')">🏢 판교</button>
    <button class="filter-btn" onclick="filterLocation('평택')">🏭 평택</button>
    <button class="filter-btn" onclick="filterLocation('부산')">⚓ 부산</button>
</div>

<div class="stats-summary">
    <div class="card">
        <div class="title">선택 거점 참여자 수</div>
        <div class="value" id="total-count">0명</div>
    </div>
    <div class="card">
        <div class="title">평균 풀이 시간</div>
        <div class="value" id="avg-time">0초</div>
    </div>
</div>

<h2>📊 문제별 선택 비율</h2>
<div id="questions-container"></div>

<h2>📝 참여자별 상세 응답 내역</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>이름 (소속 거점)</th>
                <th>점수</th>
                <th>풀이시간</th>
                <th>선택한 답안 (Q1~Q10)</th>
                <th>참여일시</th>
            </tr>
        </thead>
        <tbody id="response-table-body">
            <tr>
                <td colspan="5" style="text-align: center; color: #aaa;">데이터를 불러오는 중입니다...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let rawServerData = null;
    let currentFilter = 'ALL';

    async function fetchStats() {
        try {
            const res = await fetch('/api/stats');
            rawServerData = await res.json();
            renderDashboard();
        } catch (err) {
            console.error(err);
        }
    }

    function filterLocation(loc) {
        currentFilter = loc;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderDashboard();
    }

    function renderDashboard() {
        if (!rawServerData) return;

        let filteredUsers = rawServerData.user_responses || [];
        if (currentFilter !== 'ALL') {
            filteredUsers = filteredUsers.filter(u => u.name.includes(`(${currentFilter})`));
        }

        const totalCount = filteredUsers.length;
        const avgTime = totalCount > 0 
            ? (filteredUsers.reduce((acc, u) => acc + u.time, 0) / totalCount).toFixed(1) 
            : 0;

        document.getElementById('total-count').innerText = `${totalCount}명`;
        document.getElementById('avg-time').innerText = `${avgTime}초`;

        const questionStats = {};
        for(let q=1; q<=10; q++) questionStats[q] = {1:0, 2:0, 3:0, 4:0};

        filteredUsers.forEach(u => {
            u.answers.forEach((ans, idx) => {
                const qNum = idx + 1;
                if (questionStats[qNum] && questionStats[qNum][ans] !== undefined) {
                    questionStats[qNum][ans]++;
                }
            });
        });

        const qContainer = document.getElementById('questions-container');
        qContainer.innerHTML = '';

        if (totalCount === 0) {
            qContainer.innerHTML = '<p style="color:#aaa;">해당 거점의 참여 데이터가 없습니다.</p>';
        } else {
            for (let qNum = 1; qNum <= 10; qNum++) {
                const qCard = document.createElement('div');
                qCard.className = 'q-card';

                let html = `<div class="q-title">Q${qNum}번 문제 답변 분포</div>`;
                const stats = questionStats[qNum];

                for (let opt = 1; opt <= 4; opt++) {
                    const count = stats[opt] || 0;
                    const percent = totalCount > 0 ? ((count / totalCount) * 100).toFixed(0) : 0;

                    html += `
                        <div class="bar-group">
                            <span class="bar-label">${opt}번</span>
                            <div class="bar-track">
                                <div class="bar-fill" style="width: ${percent}%;"></div>
                            </div>
                            <span class="bar-value">${count}명 (${percent}%)</span>
                        </div>
                    `;
                }
                qCard.innerHTML = html;
                qContainer.appendChild(qCard);
            }
        }

        const tbody = document.getElementById('response-table-body');
        tbody.innerHTML = '';

        if (filteredUsers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #aaa;">참여자가 없습니다.</td></tr>';
        } else {
            filteredUsers.forEach(user => {
                const tr = document.createElement('tr');
                const ansStr = user.answers.map((a, i) => `Q${i+1}:${a}번`).join(', ');

                tr.innerHTML = `
                    <td><strong>${user.name}</strong></td>
                    <td><span class="badge">${user.score}점</span></td>
                    <td>${user.time}초</td>
                    <td>${ansStr}</td>
                    <td style="color:#aaa;">${user.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    }

    fetchStats();
</script>

</body>
</html>
