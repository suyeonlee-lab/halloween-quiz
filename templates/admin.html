<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 퀴즈 통계 대시보드</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #120826;
            color: #fff;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #ff9e22;
            margin-bottom: 20px;
            font-size: 24px;
        }
        h2 {
            font-size: 18px;
            margin: 20px 0 10px 0;
            color: #ffb74d;
        }
        .stats-summary {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 158, 34, 0.3);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            text-align: center;
        }
        .card .title {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            color: #ff9e22;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

<h1>🎃 할로윈 퀴즈 응답 통계 대시보드</h1>

<div class="stats-summary">
    <div class="card">
        <div class="title">총 참여자 수</div>
        <div class="value" id="total-count">0명</div>
    </div>
    <div class="card">
        <div class="title">평균 풀이 시간</div>
        <div class="value" id="avg-time">0초</div>
    </div>
</div>

<h2>📊 문제별 답변 비율 (파이 차트)</h2>
<div class="chart-grid" id="charts-container"></div>

<script>
    async function loadStats() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();

            document.getElementById('total-count').innerText = `${data.total_count}명`;
            document.getElementById('avg-time').innerText = `${data.avg_time}초`;

            const container = document.getElementById('charts-container');
            container.innerHTML = '';

            if (data.total_count === 0) {
                container.innerHTML = '<p style="color:#aaa;">아직 참여 데이터가 없습니다.</p>';
                return;
            }

            for (let qNum in data.question_stats) {
                const chartDiv = document.createElement('div');
                chartDiv.className = 'chart-card';
                chartDiv.id = `chart-q${qNum}`;
                container.appendChild(chartDiv);

                const qStats = data.question_stats[qNum];
                const labels = ['1번', '2번', '3번', '4번', '5번'];
                const values = [qStats[1]||0, qStats[2]||0, qStats[3]||0, qStats[4]||0, qStats[5]||0];

                const plotData = [{
                    values: values,
                    labels: labels,
                    type: 'pie',
                    textinfo: 'label+percent',
                    insidetextorientation: 'radial',
                    marker: {
                        colors: ['#ff9e22', '#ff5200', '#b388ff', '#00e676', '#29b6f6']
                    }
                }];

                const layout = {
                    title: { text: `Q${qNum}번 문제 답변 비율`, font: { color: '#ffffff', size: 16 } },
                    height: 280,
                    margin: { t: 40, b: 20, l: 20, r: 20 },
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    showlegend: true,
                    legend: { font: { color: '#ffffff' } }
                };

                Plotly.newPlot(`chart-q${qNum}`, plotData, layout);
            }
        } catch (err) {
            console.error(err);
        }
    }

    loadStats();
</script>

</body>
</html>
