<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할로윈 퀴즈 응답 통계</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }
        body {
            background-color: #120826;
            color: #fff;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #ff9e22;
            margin-bottom: 20px;
            font-size: 24px;
        }
        h2 {
            font-size: 18px;
            margin: 30px 0 15px 0;
            color: #ffb74d;
        }
        .stats-summary {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 158, 34, 0.3);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            text-align: center;
        }
        .card .title {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .card .value {
            font-size: 28px;
            font-weight: bold;
            color: #ff9e22;
        }

        /* 깔끔한 막대 그래프 리스트 */
        .q-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .q-title {
            font-size: 16px;
            font-weight: bold;
            color: #ff9e22;
            margin-bottom: 15px;
        }
        .bar-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .bar-label {
            width: 50px;
            color: #ddd;
        }
        .bar-track {
            flex: 1;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 0 10px;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9e22, #ff5200);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        .bar-value {
            width: 60px;
            text-align: right;
            color: #ffb74d;
            font-weight: bold;
        }

        /* 참여자 상세 응답 테이블 */
        .table-container {
            width: 100%;
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }
        th, td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            white-space: nowrap;
        }
        th {
            background: rgba(255, 158, 34, 0.2);
            color: #ffb74d;
            font-weight: bold;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            background: #ff9e22;
            color: #120826;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>🎃 할로윈 퀴즈 응답 통계</h1>

<div class="stats-summary">
    <div class="card">
        <div class="title">총 참여자 수</div>
        <div class="value" id="total-count">0명</div>
    </div>
    <div class="card">
        <div class="title">평균 풀이 시간</div>
        <div class="value" id="avg-time">0초</div>
    </div>
</div>

<h2>📊 문제별 선택 비율</h2>
<div id="questions-container"></div>

<h2>📝 참여자별 상세 응답 내역</h2>
<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>이름</th>
                <th>점수</th>
                <th>풀이시간</th>
                <th>선택한 답안 (Q1, Q2, ...)</th>
                <th>참여일시</th>
            </tr>
        </thead>
        <tbody id="response-table-body">
            <tr>
                <td colspan="5" style="text-align: center; color: #aaa;">데이터를 불러오는 중입니다...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    async function loadStats() {
        try {
            const res = await fetch('/api/stats');
            const data = await res.json();

            document.getElementById('total-count').innerText = `${data.total_count}명`;
            document.getElementById('avg-time').innerText = `${data.avg_time}초`;

            // 1. 문제별 막대 그래프 생성
            const qContainer = document.getElementById('questions-container');
            qContainer.innerHTML = '';

            if (data.total_count === 0) {
                qContainer.innerHTML = '<p style="color:#aaa;">아직 참여한 기록이 없습니다.</p>';
            } else {
                for (let qNum in data.question_stats) {
                    const qCard = document.createElement('div');
                    qCard.className = 'q-card';

                    let html = `<div class="q-title">Q${qNum}번 문제 답변 분포</div>`;
                    const stats = data.question_stats[qNum];

                    for (let opt = 1; opt <= 5; opt++) {
                        const count = stats[opt] || 0;
                        const percent = data.total_count > 0 ? ((count / data.total_count) * 100).toFixed(0) : 0;

                        html += `
                            <div class="bar-group">
                                <span class="bar-label">${opt}번</span>
                                <div class="bar-track">
                                    <div class="bar-fill" style="width: ${percent}%;"></div>
                                </div>
                                <span class="bar-value">${count}명 (${percent}%)</span>
                            </div>
                        `;
                    }
                    qCard.innerHTML = html;
                    qContainer.appendChild(qCard);
                }
            }

            // 2. 전체 응답 내역 테이블 생성 (누가 뭐라고 대답했는지)
            const tbody = document.getElementById('response-table-body');
            tbody.innerHTML = '';

            if (!data.user_responses || data.user_responses.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #aaa;">참여자가 없습니다.</td></tr>';
            } else {
                data.user_responses.forEach(user => {
                    const tr = document.createElement('tr');
                    const ansStr = user.answers.map((a, i) => `Q${i+1}:${a}번`).join(', ');

                    tr.innerHTML = `
                        <td><strong>${user.name}</strong></td>
                        <td><span class="badge">${user.score}점</span></td>
                        <td>${user.time}초</td>
                        <td>${ansStr}</td>
                        <td style="color:#aaa;">${user.date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

        } catch (err) {
            console.error(err);
        }
    }

    loadStats();
</script>

</body>
</html>
