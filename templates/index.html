<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인텔리안 할로윈 상식 고사</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: #120826;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 모바일 카드 스타일 컨테이너 */
        .quiz-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            color: white;
        }

        /* 화면 영역 공통 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            transform: translateY(20px);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* 1. 시작 화면 */
        #start-screen {
            background-image: url("{{ url_for('static', filename='main_bg.png') }}");
            justify-content: flex-end;
            padding-bottom: 50px;
        }

        .input-box {
            width: 100%;
            margin-bottom: 12px;
        }

        .input-box input, .input-box select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #ff9e22;
            background: rgba(20, 10, 35, 0.9);
            color: #fff;
            font-size: 15px;
            text-align: center;
            outline: none;
            appearance: none;
        }

        .start-btn {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff9e22, #ff5200);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 120, 0, 0.4);
            margin-top: 10px;
        }

       /* 2. 문제 화면 (중앙 정렬로 위치 조정) */
        #quiz-screen {
            background-image: url("{{ url_for('static', filename='quiz_bg.png') }}");
            justify-content: center; /* 위쪽 쏠림 해결 및 중앙 정렬 */
            padding-top: 40px;
            padding-bottom: 60px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            width: 10%;
            background: #ff9e22;
            transition: width 0.3s ease;
        }

        .question-number {
            font-size: 14px;
            color: #ffb74d;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .question-text {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .options-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(20, 10, 35, 0.8);
            color: #efefef;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.3;
        }

        .option-btn:active {
            background: #ff9e22;
            color: #120826;
            font-weight: bold;
        }

        /* 3. 로딩 화면 */
        #loading-screen {
            background-image: url("{{ url_for('static', filename='main_bg.png') }}");
            justify-content: center;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top: 6px solid #ff9e22;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 4. 결과 화면 */
        #result-screen {
            background-image: url("{{ url_for('static', filename='quiz_bg.png') }}");
            justify-content: center;
            text-align: center;
        }

        .result-card {
            background: rgba(20, 10, 35, 0.88);
            border: 2px solid #ff9e22;
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
        }

        .result-title {
            font-size: 22px;
            color: #ff9e22;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 38px;
            font-weight: bold;
            margin: 15px 0;
            color: #fff;
        }

        .result-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 20px;
            word-break: keep-all;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
        <div style="width: 100%;">
            <div class="input-box">
                <input type="text" id="user-name" placeholder="🎃 성함을 입력해주세요!" autocomplete="off">
            </div>
            <div class="input-box">
                <select id="user-location">
                    <option value="" disabled selected>👻 당신이 소환된 거점은?</option>
                    <option value="판교">판교 (IT 밸리 유령)</option>
                    <option value="평택">평택 (최첨단 안테나 기지)</option>
                    <option value="부산">부산 (망망대해 해상 유령)</option>
                </select>
            </div>
            <button class="start-btn" onclick="startQuiz()">🎃 상식 고사 시작하기</button>
        </div>
    </div>

    <!-- 2. 퀴즈 진행 화면 -->
    <div id="quiz-screen" class="screen">
        <div style="width: 100%;">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="question-number" id="question-number">Q1.</div>
            <div class="question-text" id="question-text">문제 내용</div>
            <div class="options-container" id="options-container"></div>
        </div>
    </div>

    <!-- 3. 분석 중 로딩 화면 (3초) -->
    <div id="loading-screen" class="screen">
        <div>
            <div class="spinner"></div>
            <h2 style="color: #fff;">위성 빔 조정 중...🛰️<br>할로윈 점수 분석 중!👻</h2>
        </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="result-screen" class="screen">
        <div class="result-card">
            <div class="result-title" id="result-title">결과 타이틀</div>
            <div class="result-score" id="result-score">0 / 10</div>
            <p class="result-desc" id="result-desc">결과 멘트</p>
            <button class="start-btn" onclick="location.reload()">🔄 다시 도전하기</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "인텔리안 제품이 활약하는 곳은 어디일까요?",
            options: [
                "① 놀이공원",
                "② 주방과 냉장고",
                "③ 바다와 육지, 하늘",
                "④ 지하철역"
            ],
            answer: 3
        },
        {
            q: "인텔리안 Flat Panel 안테나는 기계적으로 크게 움직이는 대신 어떻게 위성 방향을 맞출까요?",
            options: [
                "① 배를 돌린다",
                "② 전자적으로 빔 방향을 조정한다",
                "③ 안테나를 접었다 편다",
                "④ 갈매기에게 방향을 물어본다"
            ],
            answer: 2
        },
        {
            q: "전 세계 해상 조난 및 안전 시스템 GMDSS는 바다에서 어떤 상황에 특히 중요한 체계일까요?",
            options: [
                "① 해산물 요리 대회",
                "② 선상 노래방",
                "③ 낚시 대회",
                "④ 조난·긴급 상황"
            ],
            answer: 4
        },
        {
            q: "우리 회사 이름 'Intellian(인텔리안)'의 탄생 배경이자 진짜 의미는 무엇일까요?",
            options: [
                "① Intel + Alien (외계인 수준의 천재 기술력)",
                "② Intelligent + Antenna (지능형 안테나)",
                "③ International + Alliance (글로벌 해상 동맹)",
                "④ Internet + Brilliant (눈부신 위성 인터넷)"
            ],
            answer: 2
        },
        {
            q: "인텔리안과 긴밀하게 협력하며 저궤도(LEO) 및 중궤도(MEO) 차세대 위성 통신망을 함께 구축하는 글로벌 파트너사가 아닌 곳은?",
            options: [
                "① Eutelsat OneWeb",
                "② SES",
                "③ Telesat",
                "④ Paul Bassett (폴바셋)"
            ],
            answer: 4
        },
        {
            q: "망망대해를 항해하는 크루즈와 어선에서도 끊김 없이 TV 방송을 시청할 수 있도록 돕는 인텔리안의 대표 위성 TV 안테나 시리즈 명칭은?",
            options: [
                "① i-Series",
                "② v-Series",
                "③ Netflix-Series",
                "④ K-series"
            ],
            answer: 1
        },
        {
            q: "해양 수도 부산에 위치한 인텔리안 해양사업부의 핵심 역할 및 기능으로 가장 거리가 먼 것은?",
            options: [
                "① 해상 위성 통신(VSAT) 안테나 시험 및 R&D",
                "② 글로벌 선주 및 고객사 대상 해상 기술 지원",
                "③ 해양 위성통신 서비스 거점 및 연구개발",
                "④ 부산 앞바다에서 부캉이 구경"
            ],
            answer: 4
        },
        {
            q: "군/방위산업(Mil/Gov)을 위해 만들어진 제품 중, 군인들이 전장에서 '직접 메고 다닐 수 있도록' 가볍고 튼튼하게 설계된 LEO 터미널의 이름은 무엇일까요?",
            options: [
                "① Jetpack",
                "② Ironpack",
                "③ Manpack",
                "④ Backpack"
            ],
            answer: 3
        },
        {
            q: "인텔리안의 최첨단 위성 안테나 연구개발 센터와 대규모 핵심 제조 시설(캠퍼스)이 자리 잡고 있는 국내 도시는 어디일까요?",
            options: [
                "① 경기도 평택",
                "② 제주특별자치도",
                "③ 강원도 속초",
                "④ 그대 마음속…☆"
            ],
            answer: 1
        },
        {
            q: "회사의 성장을 함께 응원하는 직장인이라면 꼭 알아야 할 인텔리안테크의 코스닥 종목 코드는 무엇일까요?",
            options: [
                "① 035420",
                "② 000660",
                "③ 005930",
                "④ 189300"
            ],
            answer: 4
        }
    ];

    let currentQ = 0;
    let userName = "";
    let userLocation = "";
    let selectedAnswers = [];
    let score = 0;
    let startTime = 0;

    function startQuiz() {
        const nameInput = document.getElementById('user-name').value.trim();
        const locationInput = document.getElementById('user-location').value;

        if (!nameInput) {
            alert("성함을 입력해주세요!");
            return;
        }
        if (!locationInput) {
            alert("거점(판교/평택/부산)을 선택해주세요!");
            return;
        }

        userName = nameInput;
        userLocation = locationInput;
        startTime = Date.now();

        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        const qData = questions[currentQ];
        document.getElementById('question-number').innerText = `Q${currentQ + 1} / ${questions.length}`;
        document.getElementById('question-text').innerText = qData.q;
        
        const progressPercent = ((currentQ + 1) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        qData.options.forEach((optText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = optText;
            btn.onclick = () => selectOption(idx + 1);
            container.appendChild(btn);
        });
    }

    function selectOption(optionNum) {
        selectedAnswers.push(optionNum);
        
        if (optionNum === questions[currentQ].answer) {
            score++;
        }

        currentQ++;

        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);

        showScreen('loading-screen');

        fetch('/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_name: `${userName}(${userLocation})`,
                score: score,
                total_time: parseFloat(totalTime),
                answers: selectedAnswers
            })
        });

        setTimeout(() => {
            showResult();
            showScreen('result-screen');
        }, 3000);
    }

    function showResult() {
        document.getElementById('result-score').innerText = `${score} / ${questions.length}`;
        
        const titleEl = document.getElementById('result-title');
        const descEl = document.getElementById('result-desc');

        if (score <= 3) {
            titleEl.innerText = "👻 영혼 탈곡기 가동! 앗... 꽝!";
            descEl.innerText = `🚨 비상! [${userLocation}] 거점에 출몰한 할로윈 유령이 ${userName}님의 정답을 싹 털어갔습니다!\n오늘 몸만 출근하고 영혼은 침대에 두고 오셨나요? 달콤한 사탕 드시고 안테나 신호 다시 잡아서 재도전해보세요! 🍬`;
        } else if (score <= 7) {
            titleEl.innerText = "🎃 제법인데? 명예 인텔리안 호박!";
            descEl.innerText = `오~ 훌륭합니다! ${userName}님은 [${userLocation}]을 대표하는 든든한 상식러!\n몇몇 고난도 함정에 살짝 걸렸지만 위성 궤도는 거의 다 맞추셨어요. 딱 3문제만 더 맞히면 글로벌 1위 궤도 진입 가능합니다! 🛰️⚡`;
        } else {
            titleEl.innerText = "🏆 완벽한 지능형 브레인! 상식 고수 등장!";
            descEl.innerText = `🎉 축하합니다 ${userName}님! [${userLocation}]을 대표하는 완벽한 인텔리안 상식왕이십니다!🛰️\n완벽한 지식으로 할로윈 축제를 정복하셨습니다. 당당하게 사탕 받으러 가세요! 🍭👑`;
        }
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }
</script>

</body>
</html>
